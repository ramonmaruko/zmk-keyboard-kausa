boards:
  - name: kausa_left
    full_name: Kausa (Left)
    vendor: ramonmaruko
    socs:
      - name: nrf54l15
        variants:
          - name: zmk
            cpucluster: cpuapp
  - name: kausa_right
    full_name: Kausa (Right)
    vendor: ramonmaruko
    socs:
      - name: nrf54l15
        variants:
          - name: zmk
            cpucluster: cpuapp

runners:
  run_once:
    '--recover':
      - runners:
          - nrfjprog
          - nrfutil
        run: first
        groups:
          - boards:
              - kausa_left/nrf54l15/cpuapp/zmk
              - kausa_right/nrf54l15/cpuapp/zmk
    '--erase':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: first
        groups:
          - boards:
              - kausa_left/nrf54l15/cpuapp/zmk
              - kausa_right/nrf54l15/cpuapp/zmk
    '--reset':
      - runners:
          - nrfjprog
          - jlink
          - nrfutil
        run: last
        groups:
          - boards:
              - kausa_left/nrf54l15/cpuapp/zmk
              - kausa_right/nrf54l15/cpuapp/zmk
